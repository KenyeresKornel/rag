name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Maven build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven build and unit tests
        shell: bash
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress clean verify 2>&1 | tee ci-build.log

      - name: Publish test results and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-results-and-build-log
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            ci-build.log
          if-no-files-found: warn
          retention-days: 14